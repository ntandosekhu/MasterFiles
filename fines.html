<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Beyers Naude - Discipline Management</title>
<style>
:root{
  --space-blue-primary:#1D2951;--space-blue-hover:#141C38;--space-blue-light:#EFF3F9;
  --space-blue-border:#D0DCED;--space-blue-accent:#3B5295;--bg-page:#F4F6F9;--bg-card:#FFFFFF;
  --text-main:#0F172A;--text-muted:#475569;--text-subtle:#64748B;
  --danger-red:#DC2626;--danger-red-hover:#B91C1C;--danger-light:#FEF2F2;--danger-border:#FCA5A5;
  --success-green:#16A34A;--success-light:#F0FDF4;--success-border:#86EFAC;
  --warning-amber:#D97706;--warning-light:#FFFBEB;--warning-border:#FDE68A;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04);
  --shadow-md:0 4px 12px rgba(29,41,81,0.08);--shadow-lg:0 10px 25px rgba(29,41,81,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-page);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;
  line-height:1.5;-webkit-font-smoothing:antialiased;}
.header{background:var(--space-blue-primary);color:#FFF;padding:16px 32px;display:flex;
  justify-content:space-between;align-items:center;box-shadow:var(--shadow-md);position:sticky;top:0;z-index:100;}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;}
.brand p{color:#A0B2D6;font-size:13px;font-weight:500;margin-top:2px;}
.header-actions{display:flex;align-items:center;gap:12px;}
.btn-nav{border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.1);color:#FFF;
  padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;
  text-decoration:none;transition:all .15s ease;display:inline-flex;align-items:center;gap:6px;}
.btn-nav:hover{background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.4);}
.btn-primary-action{background:var(--space-blue-accent);color:#FFF;border:1px solid rgba(255,255,255,0.3);
  padding:8px 18px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:700;transition:all .15s ease;}
.btn-primary-action:hover{background:#2F437D;border-color:#FFF;}
.logout-button{border:none;background:var(--danger-red);color:#FFF;padding:8px 16px;
  border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;transition:background-color .15s ease;}
.logout-button:hover{background:var(--danger-red-hover);}
.container{max-width:1280px;width:100%;margin:0 auto;padding:32px 24px 60px;flex:1;}
.page-intro{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--space-blue-border);
  display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;}
.page-intro h2{font-size:26px;font-weight:800;color:var(--space-blue-primary);letter-spacing:-0.02em;margin-bottom:4px;}
.page-intro p{color:var(--text-muted);font-size:15px;}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--space-blue-border);margin-bottom:24px;}
.tab-button{background:none;border:none;padding:12px 22px;font-size:14px;font-weight:700;
  color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s ease;}
.tab-button:hover{color:var(--space-blue-primary);}
.tab-button.active{color:var(--space-blue-primary);border-bottom-color:var(--space-blue-primary);}
.tab-button.restricted{color:#7E22CE;}
.tab-button.restricted.active{color:#7E22CE;border-bottom-color:#7E22CE;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.summary-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-bottom:28px;}
.summary-card{background:var(--bg-card);border-radius:var(--radius-md);padding:18px 20px;
  border:1px solid var(--space-blue-border);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.summary-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:4px;background:var(--space-blue-primary);}
.summary-card.active::before{background:var(--space-blue-accent);}
.summary-card.disputed::before{background:var(--warning-amber);}
.summary-card.paid::before{background:var(--success-green);}
.summary-card.overdue::before{background:var(--danger-red);}
.summary-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-subtle);margin-bottom:8px;}
.summary-value{font-size:28px;font-weight:800;color:var(--space-blue-primary);line-height:1.1;}
.summary-subtext{font-size:12px;color:var(--text-muted);margin-top:6px;}
.filter-panel{background:var(--bg-card);border-radius:var(--radius-md);padding:20px;
  border:1px solid var(--space-blue-border);box-shadow:var(--shadow-sm);margin-bottom:24px;display:flex;flex-direction:column;gap:16px;}
.filter-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end;}
.filter-group{display:flex;flex-direction:column;gap:6px;}
.filter-label{font-size:12px;font-weight:700;color:var(--text-main);text-transform:uppercase;letter-spacing:.03em;}
.form-control{width:100%;padding:9px 12px;font-size:14px;border:1px solid var(--space-blue-border);
  border-radius:var(--radius-sm);background:#FFF;color:var(--text-main);outline:none;transition:border-color .15s,box-shadow .15s;}
.form-control:focus{border-color:var(--space-blue-accent);box-shadow:0 0 0 3px rgba(59,82,149,0.15);}
textarea.form-control{resize:vertical;font-family:inherit;}
.btn-reset{background:var(--space-blue-light);color:var(--space-blue-primary);border:1px solid var(--space-blue-border);
  padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;height:38px;white-space:nowrap;}
.btn-reset:hover{background:var(--space-blue-border);}
.active-filter-indicator{font-size:13px;color:var(--text-muted);display:flex;align-items:center;
  justify-content:space-between;padding-top:8px;border-top:1px dashed var(--space-blue-border);}
.table-card{background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--space-blue-border);
  box-shadow:var(--shadow-sm);overflow:hidden;}
.table-wrapper{width:100%;overflow-x:auto;}
table{width:100%;border-collapse:collapse;text-align:left;font-size:14px;}
thead{background:var(--space-blue-light);border-bottom:2px solid var(--space-blue-border);}
th{padding:14px 16px;font-weight:700;color:var(--space-blue-primary);font-size:12px;text-transform:uppercase;
  letter-spacing:.04em;white-space:nowrap;}
td{padding:14px 16px;border-bottom:1px solid #E2E8F0;color:var(--text-main);vertical-align:middle;}
tbody tr:hover{background:#F8FAFC;}
tbody tr:last-child td{border-bottom:none;}
.resident-meta{display:flex;flex-direction:column;}
.resident-name{font-weight:700;color:var(--text-main);}
.resident-sub{font-size:12px;color:var(--text-subtle);}
.amount-tag{font-family:monospace;font-weight:700;font-size:15px;color:var(--space-blue-primary);}
.status-badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11px;
  font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1;width:fit-content;}
.badge-active{background:var(--space-blue-light);color:var(--space-blue-primary);border:1px solid var(--space-blue-border);}
.badge-paid{background:var(--success-light);color:var(--success-green);border:1px solid var(--success-border);}
.badge-disputed{background:var(--warning-light);color:var(--warning-amber);border:1px solid var(--warning-border);}
.badge-overdue{background:var(--danger-light);color:var(--danger-red);border:1px solid var(--danger-border);}
.badge-cancelled{background:#F1F5F9;color:var(--text-subtle);border:1px solid #CBD5E1;}
.badge-warning-record{background:#FAF5FF;color:#7E22CE;border:1px solid #E9D5FF;}
.badge-dc{background:#FAF5FF;color:#7E22CE;border:1px solid #E9D5FF;}
.badge-level{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;
  background:#E2E8F0;color:#334155;margin-left:6px;}
.btn-action{background:#FFF;border:1px solid var(--space-blue-border);color:var(--space-blue-primary);
  padding:6px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
.btn-action:hover{background:var(--space-blue-primary);color:#FFF;border-color:var(--space-blue-primary);}
.state-container{padding:48px 24px;text-align:center;color:var(--text-muted);}
.state-container h4{font-size:16px;font-weight:700;color:var(--text-main);margin-bottom:6px;}
.spinner{width:32px;height:32px;border:3px solid var(--space-blue-light);border-top:3px solid var(--space-blue-primary);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;visibility:hidden;transition:all .2s ease;padding:20px;}
.modal-overlay.active{opacity:1;visibility:visible;}
.modal-card{background:var(--bg-card);border-radius:var(--radius-lg);width:100%;max-width:640px;
  border:1px solid var(--space-blue-border);box-shadow:var(--shadow-lg);overflow:hidden;
  transform:translateY(10px);transition:transform .2s ease;max-height:92vh;display:flex;flex-direction:column;}
.modal-overlay.active .modal-card{transform:translateY(0);}
.modal-card.wide{max-width:900px;}
.modal-header{background:var(--space-blue-primary);color:#FFF;padding:18px 24px;display:flex;
  justify-content:space-between;align-items:center;}
.modal-header h3{font-size:18px;font-weight:700;}
.modal-close{background:none;border:none;color:#A0B2D6;font-size:20px;cursor:pointer;padding:4px;line-height:1;}
.modal-close:hover{color:#FFF;}
.modal-body{padding:24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;}
.modal-footer{padding:16px 24px;background:var(--space-blue-light);border-top:1px solid var(--space-blue-border);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.detail-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--bg-page);
  padding:16px;border-radius:var(--radius-md);border:1px solid #E2E8F0;}
.detail-item{display:flex;flex-direction:column;}
.detail-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-subtle);letter-spacing:.03em;}
.detail-val{font-size:14px;font-weight:600;color:var(--text-main);margin-top:2px;}
.description-box{background:#FFF;border:1px solid var(--space-blue-border);border-radius:var(--radius-sm);
  padding:12px;font-size:14px;color:var(--text-main);white-space:pre-wrap;}
.btn-submit-fine{background:var(--space-blue-primary);color:#FFF;border:none;padding:10px 20px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;transition:background-color .15s ease;}
.btn-submit-fine:hover{background:var(--space-blue-hover);}
.btn-pay-confirm{background:var(--success-green);color:#FFF;border:none;padding:10px 20px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;}
.btn-pay-confirm:hover{background:#15803D;}
.btn-reinstate{background:var(--space-blue-accent);color:#FFF;border:none;padding:10px 16px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;}
.btn-danger{background:var(--danger-red);color:#FFF;border:none;padding:10px 16px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;}
.btn-danger:hover{background:var(--danger-red-hover);}
.btn-submit-fine:disabled,.btn-pay-confirm:disabled,.btn-reinstate:disabled,.btn-danger:disabled{
  background:#9CA3AF;cursor:not-allowed;}
.type-toggle-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.type-toggle-card{border:2px solid var(--space-blue-border);border-radius:var(--radius-md);padding:12px;
  cursor:pointer;display:flex;align-items:flex-start;gap:10px;background:#FFF;transition:all .15s;}
.type-toggle-card:hover{border-color:var(--space-blue-accent);}
.type-toggle-title{font-size:13px;font-weight:700;color:var(--text-main);}
.type-toggle-desc{font-size:11px;color:var(--text-muted);margin-top:2px;}
.dc-case-row{background:#FFF;border:1px solid var(--space-blue-border);border-radius:var(--radius-md);
  padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  cursor:pointer;transition:all .15s ease;border-left:4px solid #7E22CE;}
.dc-case-row:hover{border-color:#7E22CE;box-shadow:var(--shadow-md);}
.dc-case-info{display:flex;flex-direction:column;gap:4px;flex:1;min-width:220px;}
.dc-case-id{font-family:monospace;font-size:12px;font-weight:700;color:#7E22CE;}
.dc-case-subject{font-size:15px;font-weight:700;color:var(--text-main);}
.dc-case-summary{font-size:13px;color:var(--text-muted);}
.dc-case-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.evidence-item{background:var(--bg-page);border:1px solid var(--space-blue-border);border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;gap:10px;}
.evidence-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.evidence-id{font-family:monospace;font-size:12px;font-weight:700;color:var(--space-blue-accent);}
.evidence-meta{font-size:12px;color:var(--text-subtle);}
.evidence-content{font-size:14px;color:var(--text-main);white-space:pre-wrap;}
.comments-list{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--space-blue-border);padding-top:10px;margin-top:6px;}
.comment-item{background:#FFF;border:1px solid var(--space-blue-border);border-radius:var(--radius-sm);padding:10px;}
.comment-author{font-size:12px;font-weight:700;color:var(--space-blue-primary);}
.comment-text{font-size:13px;color:var(--text-main);margin-top:2px;white-space:pre-wrap;}
.comment-time{font-size:11px;color:var(--text-subtle);margin-top:4px;}
.comment-form{display:flex;gap:8px;margin-top:8px;}
.comment-form input{flex:1;padding:8px 10px;border:1px solid var(--space-blue-border);border-radius:var(--radius-sm);font-size:13px;}
.comment-form button{padding:8px 14px;border-radius:var(--radius-sm);border:none;background:var(--space-blue-primary);
  color:#FFF;font-size:12px;font-weight:700;cursor:pointer
