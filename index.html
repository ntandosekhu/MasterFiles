<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Firebase App Check & Core SDKs -->
  <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;

      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      color: #1a1a1a;
    }

<body>

  <div class="card">
    <h1>Thank you House Beyers</h1>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Ensure Firebase project is initialized prior to App Check setup
      if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
        const appCheck = firebase.appCheck();
        appCheck.activate(
          new firebase.appCheck.ReCaptchaV3Provider('6LfAPn8tAAAAAOa1QF1-NqwCu6aPsGWyOep3mo2s'),
          true
        );
      }
    });
