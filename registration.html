<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Files - Registration</title>

    <style>
        :root {
            --primary: #1d2951;
            --primary-hover: #151f3d;
            --primary-light: #3b82f6;
            --background-dark: #0b1329;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --error-color: #dc2626;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --success-color: #166534;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 80% 20%, #1e3a8a 0%, #0f172a 50%, var(--background-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .registration-card {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header p {
            margin-top: 6px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
        }

        .account-type-info {
            background: #f0f9ff;
            border-left: 4px solid var(--primary-light);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            color: #1e293b;
            font-size: 13px;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background-color: #f8fafc;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus {
            background-color: #ffffff;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        select:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .account-fields {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .account-fields h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .register-button {
            width: 100%;
            margin-top: 28px;
            border: none;
            border-radius: 8px;
            padding: 13px;
            background: var(--primary);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(29, 41, 81, 0.25);
        }

        .register-button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .register-button:active {
            transform: translateY(0);
        }

        .register-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
            text-align: center;
        }

        .message.error {
            display: block;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-color);
        }

        .message.success {
            display: block;
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-color);
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-link a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .login-link a:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .registration-card {
                padding: 32px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div id="appCheckLoading" style="color: #ffffff; font-size: 16px; font-weight: 600; text-align: center;">
    Loading...
</div>

<div class="registration-card" id="appContent" style="display: none;">

    <div class="header">
        <h1>Master Files</h1>
        <p>Create your account</p>
    </div>

    <div class="account-type-info">
        Select the type of account you are registering. Your account status will be determined automatically.
    </div>

    <form id="registrationForm">

        <div class="form-grid">

            <div class="form-group">
                <label for="name">First Name</label>
                <input
                    type="text"
                    id="name"
                    required
                    autocomplete="given-name"
                    placeholder="First name"
                >
            </div>

            <div class="form-group">
                <label for="surname">Surname</label>
                <input
                    type="text"
                    id="surname"
                    required
                    autocomplete="family-name"
                    placeholder="Surname"
                >
            </div>

            <div class="form-group full">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email"
                    placeholder="Enter your email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Enter password"
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Repeat your password"
                >
            </div>

            <div class="form-group full">
                <label for="accountType">Account Type</label>
                <select id="accountType" required>
                    <option value="">Select account type</option>
                    <option value="HOUSE_MEMBER">House Member</option>
                    <option value="ALUMNI">Alumni</option>
                    <option value="ORGANISATION">Organisation</option>
                </select>
            </div>

            <!-- NEW ACADEMIC & RESIDENCE FIELDS -->
            <div class="form-group full">
                <label for="faculty">Faculty</label>
                <select id="faculty" required>
                    <option value="" disabled selected>Select your faculty</option>
                    <option value="Faculty of Economic and Management Sciences">Faculty of Economic and Management Sciences</option>
                    <option value="Faculty of Education">Faculty of Education</option>
                    <option value="Faculty of Health Sciences">Faculty of Health Sciences</option>
                    <option value="Faculty of Law">Faculty of Law</option>
                    <option value="Faculty of Natural and Agricultural Sciences">Faculty of Natural and Agricultural Sciences</option>
                    <option value="Faculty of the Humanities">Faculty of the Humanities</option>
                    <option value="Faculty of Theology and Religion">Faculty of Theology and Religion</option>
                </select>
            </div>

            <div class="form-group full">
                <label for="academicProgramme">Academic Programme</label>
                <select id="academicProgramme" required disabled>
                    <option value="" disabled selected>Select your faculty first</option>
                </select>
            </div>

            <div class="form-group full">
                <label for="corridor">Residence Corridor</label>
                <select id="corridor" required>
                    <option value="" disabled selected>Select your corridor</option>
                    <option value="Ground Floor North">Ground Floor North</option>
                    <option value="Ground Floor South">Ground Floor South</option>
                    <option value="First Floor East">First Floor East</option>
                    <option value="First Floor West">First Floor West</option>
                    <option value="Second Floor East">Second Floor East</option>
                    <option value="Second Floor West">Second Floor West</option>
                    <option value="Third Floor Central">Third Floor Central</option>
                </select>
            </div>

        </div>

        <!-- HOUSE MEMBER FIELDS -->
        <div id="houseMemberFields" class="account-fields" style="display:none;">
            <h3>House Member Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="studentNumber">Student Number</label>
                    <input type="text" id="studentNumber" placeholder="Student number">
                </div>

                <div class="form-group">
                    <label for="roomNumber">Room Number</label>
                    <input type="text" id="roomNumber" placeholder="Room number">
                </div>

                <div class="form-group full">
                    <label for="keyNumber">Key Number</label>
                    <input type="text" id="keyNumber" placeholder="Key number">
                </div>
            </div>
        </div>

        <!-- ALUMNI FIELDS -->
        <div id="alumniFields" class="account-fields" style="display:none;">
            <h3>Alumni Information</h3>
            <div class="form-grid">
                <div class="form-group full">
                    <label for="alumniStudentNumber">Student Number</label>
                    <input type="text" id="alumniStudentNumber" placeholder="Previous student number">
                </div>
            </div>
        </div>

        <!-- ORGANISATION FIELDS -->
        <div id="organisationFields" class="account-fields" style="display:none;">
            <h3>Organisation Information</h3>
            <div class="form-grid">
                <div class="form-group full">
                    <label for="organisationName">Organisation Name</label>
                    <input type="text" id="organisationName" placeholder="Organisation name">
                </div>
            </div>
        </div>

        <button type="submit" id="registerButton" class="register-button">
            Create Account
        </button>

        <div id="message" class="message"></div>

    </form>

    <div class="login-link">
        Already have an account? <a href="index.html">Log in</a>
    </div>

</div>

    const appCheck = initializeAppCheck(app, {

    async function initializeGate() {
        try {
            await getToken(appCheck, false);
            document.getElementById("appCheckLoading").style.display = "none";
            document.getElementById("appContent").style.display = "block";
        } catch (error) {
            console.error("App Check failed:", error);

    initializeGate();

    const message = document.getElementById("message");

    const facultySelect = document.getElementById("faculty");
    const academicProgrammeSelect = document.getElementById("academicProgramme");
    const corridorSelect = document.getElementById("corridor");

    facultySelect.addEventListener("change", () => {
        const selectedFaculty = facultySelect.value;
        academicProgrammeSelect.innerHTML = "";

        if (!selectedFaculty || !UFS_2026_PROGRAMMES[selectedFaculty]) {
            academicProgrammeSelect.disabled = true;
            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = "Select your faculty first";
            placeholder.disabled = true;
            placeholder.selected = true;
            academicProgrammeSelect.appendChild(placeholder);
            return;
        }

        academicProgrammeSelect.disabled = false;
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select your academic programme";
        placeholder.disabled = true;
        placeholder.selected = true;
        academicProgrammeSelect.appendChild(placeholder);

        const programmes = UFS_2026_PROGRAMMES[selectedFaculty];
        programmes.forEach((prog) => {
            const option = document.createElement("option");
            option.value = prog.programmeName;
            option.textContent = prog.programmeName;
            academicProgrammeSelect.appendChild(option);
        });
    });

    accountType.addEventListener("change", () => {
        const type = accountType.value;

        houseMemberFields.style.display = type === "HOUSE_MEMBER" ? "block" : "none";
        alumniFields.style.display = type === "ALUMNI" ? "block" : "none";
        organisationFields.style.display = type === "ORGANISATION" ? "block" : "none";

        document.getElementById("studentNumber").required = type === "HOUSE_MEMBER";
        document.getElementById("roomNumber").required = type === "HOUSE_MEMBER";
        document.getElementById("keyNumber").required = type === "HOUSE_MEMBER";
        document.getElementById("alumniStudentNumber").required = type === "ALUMNI";
        document.getElementById("organisationName").required = type === "ORGANISATION";
    });

        event.preventDefault();
        clearMessage();

        const name = document.getElementById("name").value.trim();
        const surname = document.getElementById("surname").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const type = accountType.value;

        const selectedFaculty = facultySelect.value;
        const selectedProgramme = academicProgrammeSelect.value;
        const selectedCorridor = corridorSelect.value;

        if (password !== confirmPassword) {
            showMessage("The passwords do not match.", true);
            return;
        }

        if (!type) {
            showMessage("Please select an account type.", true);
            return;
        }

        if (!selectedFaculty) {
            showMessage("Please select your faculty.", true);
            return;
        }

        if (!selectedProgramme) {
            showMessage("Please select your academic programme.", true);
            return;
        }

        if (!selectedCorridor) {
            showMessage("Please select your residence corridor.", true);
            return;
        }

        // Cross-validation of Faculty vs Programme
        const validFacultyProgrammes = UFS_2026_PROGRAMMES[selectedFaculty] || [];
        const isValidProgramme = validFacultyProgrammes.some(p => p.programmeName === selectedProgramme);

        if (!isValidProgramme) {
            showMessage("Invalid academic programme selection for the chosen faculty.", true);
            return;
        }

        registerButton.disabled = true;
        registerButton.textContent = "Creating Account...";

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);

            console.log("Firebase Auth UID:", user.uid);

            let userData = {
                name: name,
                surname: surname,
                email: email,
                accountType: type,
                faculty: selectedFaculty,
                academicProgramme: selectedProgramme,
                corridor: selectedCorridor,
                status: type === "ORGANISATION" ? "ACTIVE" : "PENDING",
                createdAt: new Date().toISOString()
            };

            if (type === "HOUSE_MEMBER") {
                userData.studentNumber = document.getElementById("studentNumber").value.trim();
                userData.roomNumber = document.getElementById("roomNumber").value.trim();
                userData.keyNumber = document.getElementById("keyNumber").value.trim();
            }

            if (type === "ALUMNI") {
                userData.studentNumber = document.getElementById("alumniStudentNumber").value.trim();
            }

            if (type === "ORGANISATION") {
                userData.organisationName = document.getElementById("organisationName").value.trim();
            }

            await setDoc(doc(db, "users", user.uid), userData);

            console.log("User document created:", `users/${user.uid}`);

            showMessage(
                type === "ORGANISATION"
                    ? "Account created successfully. You can now log in."
                    : "Account created successfully. Your account is pending approval.",
                false
            );

            form.reset();

            academicProgrammeSelect.innerHTML = '<option value="" disabled selected>Select your faculty first</option>';
            academicProgrammeSelect.disabled = true;

            houseMemberFields.style.display = "none";
            alumniFields.style.display = "none";
            organisationFields.style.display = "none";

            registerButton.textContent = "Account Created";
        } catch (error) {
            console.error("Registration error:", error);

            let errorMessage = "Registration failed.";

            switch (error.code) {
                case "auth/email-already-in-use":
                    errorMessage = "An account with this email already exists.";
                    break;
                case "auth/invalid-email":
                    errorMessage = "Please enter a valid email address.";
                    break;
                case "auth/weak-password":
                    errorMessage = "The password is too weak.";
                    break;
                case "permission-denied":
                    errorMessage = "The account was created, but Firestore did not allow the user profile to be created.";
                    break;
                default:
                    errorMessage = error.message;
            }

            showMessage(errorMessage, true);

            registerButton.disabled = false;
            registerButton.textContent = "Create Account";
        }
    });

    function showMessage(text, isError) {
        message.textContent = text;
        message.className = "message " + (isError ? "error" : "success");
    }

    function clearMessage() {
        message.textContent = "";
        message.className = "message";
    }
</script>

</body>
</html>
