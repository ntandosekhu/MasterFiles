<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Beyers Naude - Secretary Minutes</title>

<style>
/* =========================
   GLOBAL & COLOUR SYSTEM
========================= */
:root {
    --space-blue: #1D2951;
    --space-blue-hover: #151f3d;
    --space-blue-light: #263968;
    --background: #f4f5f7;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #1f2937;
    --text-muted: #64748b;
    --badge-bg: #eff6ff;
    --badge-text: #1d4ed8;
    --success-bg: #dcfce7;
    --success-text: #15803d;
    --warning-bg: #fef3c7;
    --warning-text: #b45309;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--background);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
}

/* =========================
   HEADER & NAVIGATION
========================= */
.header {
    background: var(--space-blue);
    color: white;
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

.header-branding h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
}

.header-branding p {
    color: #cbd5e1;
    font-size: 13px;
    margin-top: 2px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.btn-nav-back {
    background: transparent;
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease;
}

.btn-nav-back:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.6);
}

.logout-button {
    background: #dc2626;
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: background 0.15s ease;
}

.logout-button:hover {
    background: #b91c1c;
}

/* =========================
   MAIN LAYOUT & LOADING
========================= */
.container {
    max-width: 1040px;
    margin: auto;
    padding: 32px 20px 48px 20px;
}

.loading-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    gap: 12px;
    color: var(--text-muted);
}

.spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--space-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.error-banner {
    display: none;
    background: #fee2e2;
    border: 1px solid #fca5a5;
    color: #991b1b;
    padding: 14px 18px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 24px;
}

.dashboard-content {
    display: none;
}

/* =========================
   PAGE HEADER & CONTROLS
========================= */
.page-title {
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
}

.page-title div h2 {
    color: var(--space-blue);
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
}

.page-title div p {
    color: var(--text-muted);
    font-size: 14px;
}

.btn-primary {
    background: var(--space-blue);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-primary:hover {
    background: var(--space-blue-hover);
}

.btn-secondary {
    background: #f1f5f9;
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
}

.btn-secondary:hover {
    background: #e2e8f0;
}

/* =========================
   MINUTES LIST & CARDS
========================= */
.events-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.event-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    overflow: hidden;
    transition: border-color 0.15s ease;
}

.event-card:hover {
    border-color: #cbd5e1;
}

.event-header {
    padding: 20px 24px;
    background: #ffffff;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
    gap: 16px;
}

.event-info h3 {
    font-size: 18px;
    font-weight: 700;
    color: var(--space-blue);
    margin-bottom: 4px;
}

.event-meta {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
}

.event-status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
}

.badge-complete {
    background: var(--success-bg);
    color: var(--success-text);
}

.badge-pending {
    background: var(--warning-bg);
    color: var(--warning-text);
}

.chevron-icon {
    font-size: 14px;
    color: var(--text-muted);
    transition: transform 0.2s ease;
}

.event-card.expanded .chevron-icon {
    transform: rotate(180deg);
}

.event-body {
    display: none;
    padding: 0 24px 24px 24px;
    border-top: 1px solid var(--border);
    background: #fafafa;
}

.event-card.expanded .event-body {
    display: block;
}

/* =========================
   POINTS LIST
========================= */
.points-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

.point-item {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
}

.point-item.dealt-with {
    background: #f8fafc;
    border-color: #e2e8f0;
}

.point-content {
    flex: 1;
}

.point-number {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 4px;
}

.point-text {
    font-size: 14px;
    color: var(--text-primary);
    line-height: 1.5;
    white-space: pre-wrap;
}

.point-item.dealt-with .point-text {
    color: #64748b;
}

.point-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
}

.point-action {
    flex-shrink: 0;
}

.btn-dealt-with {
    background: #ffffff;
    color: var(--space-blue);
    border: 1px solid var(--space-blue);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
}

.btn-dealt-with:hover {
    background: var(--space-blue);
    color: white;
}

.btn-dealt-with:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.status-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--success-text);
    background: var(--success-bg);
    padding: 6px 12px;
    border-radius: 6px;
}

.empty-state {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    color: var(--text-muted);
}

.empty-state h3 {
    font-size: 18px;
    color: var(--text-primary);
    margin-bottom: 8px;
}

/* =========================
   MODAL STYLING
========================= */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
}

.modal-card {
    background: var(--card-bg);
    border-radius: 12px;
    width: 100%;
    max-width: 650px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
}

.modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h3 {
    font-size: 18px;
    color: var(--space-blue);
    font-weight: 700;
}

.modal-close {
    background: transparent;
    border: none;
    font-size: 20px;
    color: var(--text-muted);
    cursor: pointer;
}

.modal-body {
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
}

.form-control {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #ffffff;
    color: var(--text-primary);
}

.form-control:focus {
    outline: none;
    border-color: var(--space-blue);
}

textarea.form-control {
    resize: vertical;
    min-height: 70px;
}

.modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    background: #fafafa;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
}

.points-inputs-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.point-input-group {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    position: relative;
}

.point-input-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.point-input-header label {
    font-size: 12px;
    font-weight: 700;
    color: var(--space-blue);
}

.btn-remove-point {
    background: transparent;
    border: none;
    color: #dc2626;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.modal-error {
    display: none;
    background: #fee2e2;
    border: 1px solid #fca5a5;
    color: #991b1b;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
}

/* =========================
   RESPONSIVE DESIGN
========================= */
@media (max-width: 640px) {
    .header {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px 20px;
    }

    .header-actions {
        width: 100%;
        justify-content: space-between;
    }

    .page-title {
        flex-direction: column;
        align-items: stretch;
    }

    .btn-primary {
        justify-content: center;
    }

    .point-item {
        flex-direction: column;
        align-items: stretch;
    }

    .point-action {
        margin-top: 8px;
        align-self: flex-start;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->
<header class="header">
    <div class="header-branding">
        <h1>House Beyers Naude</h1>
        <p>Master Files — Secretary Minutes</p>
    </div>
    <div class="header-actions">
        <a href="clienthub.html" class="btn-nav-back">← Client Hub</a>
        <button class="logout-button" id="logoutButton">Log Out</button>
    </div>
</header>

<main class="container">

    <!-- =========================
         LOADING & ERROR STATES
    ========================= -->
    <div id="loadingState" class="loading-container">
        <div class="spinner"></div>
        <p>Verifying access and loading secretary minutes...</p>
    </div>

    <div id="errorBanner" class="error-banner"></div>

    <!-- =========================
         DASHBOARD CONTENT
    ========================= -->
    <div id="dashboardContent" class="dashboard-content">

        <!-- TITLE & ACTION SECTION -->
        <section class="page-title">
            <div>
                <h2>Secretary Notetaking & Minutes</h2>
                <p>Record meeting minutes and track individual action points until resolved.</p>
            </div>
            <button class="btn-primary" id="openCreateModalBtn">
                <span>+ CREATE MINUTES</span>
            </button>
        </section>

        <!-- EVENTS LIST CONTAINER -->
        <div id="eventsList" class="events-list"></div>

    </div>

</main>

<!-- =========================
     CREATE MINUTES MODAL
========================= -->
<div id="createModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Create Meeting Minutes</h3>
            <button class="modal-close" id="closeCreateModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <div id="modalError" class="modal-error"></div>

            <div class="form-group">
                <label for="eventDate">Date</label>
                <input type="date" id="eventDate" class="form-control">
            </div>

            <div class="form-group">
                <label for="eventType">Event Type</label>
                <select id="eventType" class="form-control">
                    <option value="HOUSE_MEETING">HOUSE MEETING</option>
                    <option value="SUBCOMMITTEE_MEETING">SUBCOMMITTEE MEETING</option>
                    <option value="TEAM_MEETING">TEAM MEETING</option>
                </select>
            </div>

            <div class="form-group">
                <label>Minutes Points</label>
                <div id="pointsInputsContainer" class="points-inputs-container">
                    <!-- Dynamic point inputs appended here -->
                </div>
            </div>

            <button type="button" class="btn-secondary" id="addPointBtn" style="align-self: flex-start;">
                + ADD NEXT POINT
            </button>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="cancelCreateModalBtn">Cancel</button>
            <button class="btn-primary" id="saveMinutesBtn">SAVE MINUTES</button>
        </div>
    </div>
</div>

<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */
import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    initializeAppCheck,
    ReCaptchaV3Provider
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app-check.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    addDoc,
    updateDoc,
    getDocs,
    query,
    where,
    orderBy,
    serverTimestamp,
    writeBatch
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

/* =========================
   FIREBASE CONFIGURATION
========================= */
const firebaseConfig = {
    apiKey: "AIzaSyDW6IArj2dZiqbf00Ix3SPPSqvxTKG0GgE",
    authDomain: "master-files-95f6b.firebaseapp.com",
    projectId: "master-files-95f6b",
    storageBucket: "master-files-95f6b.firebasestorage.app",
    messagingSenderId: "537891510061",
    appId: "1:537891510061:web:fb46c8d1abae02b9e725a4",
    measurementId: "G-4GNVR5EBJX"
};

const app = initializeApp(firebaseConfig);

const appCheck = initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider('6LfAPn8tAAAAAOa1QF1-NqwCu6aPsGWyOep3mo2s'),
    isTokenAutoRefreshEnabled: true
});

const auth = getAuth(app);
const db = getFirestore(app);

/* =========================
   DOM REFERENCES
========================= */
const loadingState = document.getElementById("loadingState");
const dashboardContent = document.getElementById("dashboardContent");
const errorBanner = document.getElementById("errorBanner");
const eventsList = document.getElementById("eventsList");

const openCreateModalBtn = document.getElementById("openCreateModalBtn");
const closeCreateModalBtn = document.getElementById("closeCreateModalBtn");
const cancelCreateModalBtn = document.getElementById("cancelCreateModalBtn");
const createModal = document.getElementById("createModal");

const eventDateInput = document.getElementById("eventDate");
const eventTypeSelect = document.getElementById("eventType");
const pointsInputsContainer = document.getElementById("pointsInputsContainer");
const addPointBtn = document.getElementById("addPointBtn");
const saveMinutesBtn = document.getElementById("saveMinutesBtn");
const modalError = document.getElementById("modalError");
const logoutButton = document.getElementById("logoutButton");

/* =========================
   STATE VARIABLES
========================= */
let currentUser = null;
let currentUserData = null;
let pointCounter = 0;

/* =========================
   HELPERS & UI
========================= */
function showError(message) {
    loadingState.style.display = "none";
    errorBanner.textContent = message;
    errorBanner.style.display = "block";
}

function showModalError(message) {
    modalError.textContent = message;
    modalError.style.display = "block";
}

function hideModalError() {
    modalError.style.display = "none";
    modalError.textContent = "";
}

function formatDateDisplay(dateString) {
    if (!dateString) return "";
    const parts = dateString.split('-');
    if (parts.length === 3) {
        const year = parts[0];
        const monthIndex = parseInt(parts[1], 10) - 1;
        const day = parseInt(parts[2], 10);
        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];
        return `${day} ${monthNames[monthIndex]} ${year}`;
    }
    return dateString;
}

function getTodayISODate() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function formatEventTypeDisplay(type) {
    switch (type) {
        case "HOUSE_MEETING": return "HOUSE MEETING";
        case "SUBCOMMITTEE_MEETING": return "SUBCOMMITTEE MEETING";
        case "TEAM_MEETING": return "TEAM MEETING";
        default: return type ? type.replace(/_/g, " ") : "";
    }
}

/* =========================
   LOGGING AUDIT ACTIVITY
========================= */
async function logActivity(action, details) {
    try {
        await addDoc(collection(db, "activityLogs"), {
            actorUid: currentUser.uid,
            actorName: currentUserData?.name || currentUser.displayName || "Unknown",
            actorRole: Array.isArray(currentUserData?.houseRoles) ? currentUserData.houseRoles.join(", ") : "Secretary",
            action: action,
            timestamp: serverTimestamp(),
            ...details
        });
    } catch (err) {
        console.error("Failed to write activity log:", err);
    }
}

/* =========================
   MODAL LOGIC
========================= */
function resetCreateModal() {
    hideModalError();
    eventDateInput.value = getTodayISODate();
    eventTypeSelect.value = "HOUSE_MEETING";
    pointsInputsContainer.innerHTML = "";
    pointCounter = 0;
    addPointInput(); // Add initial point
}

function addPointInput() {
    pointCounter++;
    const pointId = `point_input_${pointCounter}`;
    
    const div = document.createElement("div");
    div.className = "point-input-group";
    div.id = pointId;
    
    div.innerHTML = `
        <div class="point-input-header">
            <label>IMPORTANT POINT ${pointsInputsContainer.children.length + 1}</label>
            ${pointsInputsContainer.children.length > 0 ? `<button type="button" class="btn-remove-point" data-target="${pointId}">Remove</button>` : ''}
        </div>
        <textarea class="form-control point-text-input" placeholder="Enter the most important point..."></textarea>
    `;
    
    pointsInputsContainer.appendChild(div);

    // Attach remove handler if button exists
    const removeBtn = div.querySelector(".btn-remove-point");
    if (removeBtn) {
        removeBtn.addEventListener("click", () => {
            div.remove();
            renumberPointInputs();
        });
    }
}

function renumberPointInputs() {
    const groups = pointsInputsContainer.querySelectorAll(".point-input-group");
    groups.forEach((group, index) => {
        const label = group.querySelector(".point-input-header label");
        if (label) {
            label.textContent = `IMPORTANT POINT ${index + 1}`;
        }
    });
}

openCreateModalBtn.addEventListener("click", () => {
    resetCreateModal();
    createModal.style.display = "flex";
});

closeCreateModalBtn.addEventListener("click", () => {
    createModal.style.display = "none";
});

cancelCreateModalBtn.addEventListener("click", () => {
    createModal.style.display = "none";
});

addPointBtn.addEventListener("click", () => {
    addPointInput();
});

/* =========================
   SAVE MINUTES
========================= */
saveMinutesBtn.addEventListener("click", async () => {
    hideModalError();

    const selectedDate = eventDateInput.value;
    const selectedType = eventTypeSelect.value;

    if (!selectedDate) {
        showModalError("Please select a date.");
        return;
    }

    if (!selectedType) {
        showModalError("Please select an event type.");
        return;
    }

    const textInputs = pointsInputsContainer.querySelectorAll(".point-text-input");
    const pointsData = [];

    for (let i = 0; i < textInputs.length; i++) {
        const textVal = textInputs[i].value.trim();
        if (!textVal) {
            showModalError(`Point ${i + 1} is empty. Please enter text or remove the point.`);
            return;
        }
        pointsData.push(textVal);
    }

    if (pointsData.length === 0) {
        showModalError("At least one point is required.");
        return;
    }

    saveMinutesBtn.disabled = true;
    saveMinutesBtn.textContent = "Saving...";

    try {
        const creatorName = currentUserData?.name || currentUser.displayName || "Secretary";
        const creatorRole = Array.isArray(currentUserData?.houseRoles) ? currentUserData.houseRoles.find(r => r.toLowerCase().includes("secretary")) || "Secretary" : "Secretary";

        // 1. Create Event Record
        const eventRef = await addDoc(collection(db, "minutesEvents"), {
            eventType: selectedType,
            eventDate: selectedDate,
            createdByUid: currentUser.uid,
            createdByName: creatorName,
            createdByRole: creatorRole,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
            pointCount: pointsData.length,
            dealtWithCount: 0,
            status: "OUTSTANDING"
        });

        // 2. Create Individual Point Records
        const batch = writeBatch(db);
        const pointIdsCreated = [];

        for (let i = 0; i < pointsData.length; i++) {
            const newPointRef = doc(collection(db, "minutesPoints"));
            pointIdsCreated.push(newPointRef.id);

            batch.set(newPointRef, {
                eventId: eventRef.id,
                pointNumber: i + 1,
                text: pointsData[i],
                status: "OUTSTANDING",
                createdAt: serverTimestamp(),
                createdByUid: currentUser.uid,
                createdByName: creatorName,
                dealtWithAt: null,
                dealtWithByUid: null,
                dealtWithByName: null
            });
        }

        await batch.commit();

        // 3. Create Activity Log
        await logActivity("MINUTES_CREATED", {
            eventType: selectedType,
            eventId: eventRef.id,
            pointCount: pointsData.length,
            eventDate: selectedDate
        });

        createModal.style.display = "none";
        await loadMinutes();

    } catch (err) {
        console.error("Error saving minutes:", err);
        showModalError("Failed to save minutes. Please try again.");
    } finally {
        saveMinutesBtn.disabled = false;
        saveMinutesBtn.textContent = "SAVE MINUTES";
    }
});

/* =========================
   LOAD & RENDER MINUTES
========================= */
async function loadMinutes() {
    eventsList.innerHTML = "";

    try {
        // Fetch Events sorted by date descending
        const eventsQuery = query(collection(db, "minutesEvents"), orderBy("eventDate", "desc"));
        const eventsSnap = await getDocs(eventsQuery);

        if (eventsSnap.empty) {
            eventsList.innerHTML = `
                <div class="empty-state">
                    <h3>NO MINUTES RECORDED YET</h3>
                    <p>Click the button above to record your first meeting minutes.</p>
                </div>
            `;
            return;
        }

        // Fetch all points
        const pointsSnap = await getDocs(collection(db, "minutesPoints"));
        const pointsByEvent = {};

        pointsSnap.forEach(docSnap => {
            const data = docSnap.data();
            data.pointId = docSnap.id;
            if (!pointsByEvent[data.eventId]) {
                pointsByEvent[data.eventId] = [];
            }
            pointsByEvent[data.eventId].push(data);
        });

        // Render Events
        eventsSnap.forEach(eventDoc => {
            const event = eventDoc.data();
            event.eventId = eventDoc.id;

            const points = pointsByEvent[event.eventId] || [];
            // Sort points by pointNumber ascending
            points.sort((a, b) => (a.pointNumber || 0) - (b.pointNumber || 0));

            const totalPoints = points.length;
            const dealtWithCount = points.filter(p => p.status === "DEALT_WITH").length;
            const isAllDealtWith = totalPoints > 0 && totalPoints === dealtWithCount;

            const eventCard = document.createElement("div");
            eventCard.className = "event-card";
            eventCard.id = `event_card_${event.eventId}`;

            const formattedDate = formatDateDisplay(event.eventDate);
            const formattedType = formatEventTypeDisplay(event.eventType);

            eventCard.innerHTML = `
                <div class="event-header">
                    <div class="event-info">
                        <h3>${formattedType} @ ${formattedDate}</h3>
                        <div class="event-meta">
                            <span>Recorded by ${event.createdByName || "Secretary"}</span>
                            <span>•</span>
                            <span>${dealtWithCount} / ${totalPoints} DEALT WITH</span>
                            ${isAllDealtWith ? '<span class="event-status-badge badge-complete">ALL POINTS DEALT WITH</span>' : '<span class="event-status-badge badge-pending">OUTSTANDING POINTS</span>'}
                        </div>
                    </div>
                    <span class="chevron-icon">▼</span>
                </div>
                <div class="event-body">
                    <div class="points-list">
                        ${points.map(pt => renderPointItem(pt)).join('')}
                    </div>
                </div>
            `;

            // Toggle expandable behavior
            const headerEl = eventCard.querySelector(".event-header");
            headerEl.addEventListener("click", () => {
                eventCard.classList.toggle("expanded");
            });

            // Attach Mark Dealt With button listeners
            eventCard.querySelectorAll(".btn-dealt-with").forEach(btn => {
                btn.addEventListener("click", async (e) => {
                    e.stopPropagation();
                    const pointId = btn.getAttribute("data-point-id");
                    await markPointDealtWith(pointId, event.eventId);
                });
            });

            eventsList.appendChild(eventCard);
        });

    } catch (err) {
        console.error("Error loading minutes:", err);
        showError("Failed to load secretary minutes. Please refresh the page.");
    }
}

function renderPointItem(pt) {
    const isDealtWith = pt.status === "DEALT_WITH";
    const dealtWithMeta = isDealtWith && pt.dealtWithByName 
        ? `<div class="point-meta">✓ Marked dealt with by ${pt.dealtWithByName}</div>`
        : "";

    return `
        <div class="point-item ${isDealtWith ? 'dealt-with' : ''}">
            <div class="point-content">
                <div class="point-number">Point ${pt.pointNumber}</div>
                <div class="point-text">${escapeHtml(pt.text)}</div>
                ${dealtWithMeta}
            </div>
            <div class="point-action">
                ${isDealtWith 
                    ? `<span class="status-tag">✓ DEALT WITH</span>` 
                    : `<button class="btn-dealt-with" data-point-id="${pt.pointId}">MARK AS DEALT WITH</button>`
                }
            </div>
        </div>
    `;
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

/* =========================
   MARK POINT AS DEALT WITH
========================= */
async function markPointDealtWith(pointId, eventId) {
    const btn = document.querySelector(`[data-point-id="${pointId}"]`);
    if (btn) {
        btn.disabled = true;
        btn.textContent = "Updating...";
    }

    try {
        const userName = currentUserData?.name || currentUser.displayName || "Secretary";
        const pointRef = doc(db, "minutesPoints", pointId);

        // 1. Update Point
        await updateDoc(pointRef, {
            status: "DEALT_WITH",
            dealtWithAt: serverTimestamp(),
            dealtWithByUid: currentUser.uid,
            dealtWithByName: userName
        });

        // 2. Create Activity Log
        await logActivity("MINUTES_POINT_MARKED_DEALT_WITH", {
            pointId: pointId,
            eventId: eventId,
            previousState: "OUTSTANDING",
            newState: "DEALT_WITH"
        });

        // 3. Refresh display
        await loadMinutes();

    } catch (err) {
        console.error("Error marking point dealt with:", err);
        alert("Failed to update point status. Please try again.");
        if (btn) {
            btn.disabled = false;
            btn.textContent = "MARK AS DEALT WITH";
        }
    }
}

/* =========================
   LOGOUT HANDLER
========================= */
logoutButton.addEventListener("click", async () => {
    try {
        await signOut(auth);
        window.location.href = "index.html";
    } catch (error) {
        console.error("Logout error:", error);
        alert("Failed to log out. Please try again.");
    }
});

/* =========================
   AUTHENTICATION & AUTHORIZATION
========================= */
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "index.html";
        return;
    }

    currentUser = user;

    try {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
            showError("We could not load your residence profile. Please contact an administrator.");
            return;
        }

        currentUserData = userSnap.data();

        // Safely check houseRoles array for case-insensitive 'secretary' substring
        const houseRoles = Array.isArray(currentUserData.houseRoles) ? currentUserData.houseRoles : [];
        const isSecretary = houseRoles.some(role => 
            typeof role === "string" && role.toLowerCase().includes("secretary")
        );

        if (!isSecretary) {
            showError("Access Denied. You do not have the required Secretary role to view or manage meeting minutes.");
            return;
        }

        // Secretary verified, load minutes
        await loadMinutes();

        loadingState.style.display = "none";
        dashboardContent.style.display = "block";

    } catch (error) {
        console.error("Error verifying access:", error);
        showError("We could not load your residence profile. Please contact an administrator.");
    }
});

</script>
